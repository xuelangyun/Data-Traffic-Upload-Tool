name: Build & Release Windows Binary

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to use v<Cargo.toml version>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version and tag
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Raw Cargo.toml
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $cargoVersion = $Matches[1]
          } else {
            throw "Failed to parse version from Cargo.toml"
          }

          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.tag }}")) {
            $tag = "${{ inputs.tag }}".Trim()
          } else {
            $tag = "v$cargoVersion"
          }

          $assetPrefix = "win_net_stress-$tag-windows-x86_64"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_PREFIX=$assetPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release Tag: $tag"
          Write-Host "Asset Prefix: $assetPrefix"

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Build Windows release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path Cargo.lock) {
            cargo build --release --locked --target x86_64-pc-windows-msvc --verbose 2>&1 | Tee-Object -FilePath build.log
          } else {
            cargo build --release --target x86_64-pc-windows-msvc --verbose 2>&1 | Tee-Object -FilePath build.log
          }
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content build.log | Select-Object -Last 200 | ForEach-Object { Write-Host "::error::$_" }
            exit $buildExitCode
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.RELEASE_TAG }}
          path: build.log

      - name: Package release archive and SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDir = "dist"
          $bundleDir = Join-Path $distDir "bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

          $srcExe = "target/x86_64-pc-windows-msvc/release/win_net_stress.exe"
          if (-not (Test-Path -LiteralPath $srcExe -PathType Leaf)) {
            throw "Release binary missing. The Windows build must succeed before packaging: $srcExe"
          }
          if ((Get-Item -LiteralPath $srcExe).Length -le 0) {
            throw "Release binary is empty: $srcExe"
          }

          $outExe = Join-Path $distDir "$($env:ASSET_PREFIX).exe"
          $outZip = Join-Path $distDir "$($env:ASSET_PREFIX).zip"
          Copy-Item -LiteralPath $srcExe -Destination $outExe -Force
          Copy-Item -LiteralPath $srcExe -Destination (Join-Path $bundleDir "win_net_stress.exe") -Force
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $bundleDir "README.md") -Force
          Compress-Archive -Path (Join-Path $bundleDir "*") -DestinationPath $outZip -Force

          foreach ($file in @($outExe, $outZip)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -le 0) {
              throw "Expected release asset was not created: $file"
            }
          }

          $hashes = @()
          foreach ($file in @($outExe, $outZip)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $(Split-Path -Leaf $file)"
          }
          $hashFile = Join-Path $distDir "SHA256SUMS.txt"
          $hashes | Out-File -FilePath $hashFile -Encoding ascii
          Get-Content $hashFile
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PREFIX }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WinNetStress ${{ env.RELEASE_TAG }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
