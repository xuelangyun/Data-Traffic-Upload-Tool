name: Windows CI

on:
  push:
    branches: ["main", "arena/*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: Run unit tests
        shell: pwsh
        run: |
          $out = cargo test --all-targets --message-format=short 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Where-Object { $_ -match 'error' } | Select-Object -First 20 | ForEach-Object {
              Write-Host "::error::$_"
            }
            exit $code
          }

      - name: Build release binary
        shell: pwsh
        run: |
          if (Test-Path Cargo.lock) {
            cargo build --release --locked
          } else {
            cargo build --release
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: win_net_stress-windows-x86_64
          path: target/release/win_net_stress.exe
