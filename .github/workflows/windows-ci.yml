name: Windows CI

on:
  push:
    branches: ["main", "arena/*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        continue-on-error: true # Existing repository files are not fully rustfmt-clean yet.
        run: cargo fmt --all -- --check

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        continue-on-error: true
        run: cargo test --all-targets

      - name: Build release binary
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path Cargo.lock) {
            cargo build --release --locked --verbose 2>&1 | Tee-Object -FilePath build.log
          } else {
            cargo build --release --verbose 2>&1 | Tee-Object -FilePath build.log
          }
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: win_net_stress-windows-x86_64
          path: target/release/win_net_stress.exe
